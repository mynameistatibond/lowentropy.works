<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Claim Fraud Detection — Lab View</title>

    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/loading.css">
    <link rel="stylesheet" href="../assets/css/components/header.css">
    <link rel="stylesheet" href="../assets/css/components/footer.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;700&display=swap"
        rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/favicons/regular_128.png" />

    <style>
        /* Force main to take up remaining height */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main.full-app {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 !important;
            /* Override global main padding */
            margin: 0 !important;
            width: 100%;
            min-height: 100vh;
            /* Ensure iframe takes full height, pushing footer down */
        }

        iframe {
            flex: 1;
            width: 100%;
            border: none;
            display: block;
        }

        /* Override global footer spacing for tight app layout */
        /* Standard Footer for this page */
        footer {
            position: relative;
            z-index: 10;
            padding-top: 2rem !important;
            padding-bottom: 2rem !important;
        }



        .divider {
            margin: 0.5rem auto !important;
        }

        /* Dark Mode Footer Override for this page only */
        footer {
            color: #ffffff !important;
            background: #0000ff !important;
            /* Explicit Blue to match App */
        }

        footer .divider {
            border-top-color: rgba(255, 255, 255, 0.4) !important;
            margin-top: 0 !important;
        }

        /* High Specificity for Links */
        footer a,
        footer .entropy-fish-link {
            color: #ffffff !important;
            opacity: 0.8;
        }

        footer a:hover,
        footer .entropy-fish-link:hover {
            opacity: 1;
        }
    </style>
</head>

<body class="loading">
    <!-- Loader -->
    <div id="loader"></div>

    <!-- Header include -->
    <div data-include="header"></div>

    <!-- Main Content -->
    <main class="full-app">
        <iframe src="https://mynameistatibond-fraud-detector.hf.space?embed=true" loading="lazy" allow="clipboard-write"
            title="Auto Claim Fraud Detector">
        </iframe>
    </main>

    <!-- Footer include -->
    <div data-include="footer"></div>

    <!-- Scripts -->
    <script src="../assets/js/loading.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/include-components.js"></script>
    <script>
        document.addEventListener('componentsLoaded', () => {
            const footer = document.querySelector('footer');
            const iframe = document.querySelector('iframe');

            if (!footer || !iframe) return;

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    // If footer is visible, disable iframe interaction so scrolling works on body
                    if (entry.isIntersecting) {
                        iframe.style.pointerEvents = 'none';
                    } else {
                        // Footer hidden, re-enable interaction
                        iframe.style.pointerEvents = 'auto';
                    }
                });
            }, {
                threshold: 0
            }); // Trigger as soon as any part of footer is visible

            observer.observe(footer);
        });
    </script>
</body>

</html>
