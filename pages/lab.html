<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Low-Entropy Lab — Experiments</title>

    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/loading.css">
    <link rel="stylesheet" href="../assets/css/components/header.css">
    <link rel="stylesheet" href="../assets/css/components/footer.css">
    <link rel="stylesheet" href="../assets/css/pages-lab.css?v=90">
    <link rel="stylesheet" href="../assets/css/pages-lab-materials.css?v=35">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/favicons/regular_128.png" />
</head>

<body class="loading lab-page-body">

    <!-- Loader -->
    <div id="loader">
        <div class="loader-symbol">ŁѺ𝔚 Σ𐌍ŦȐΘℙΨ</div>
    </div>

    <!-- Header -->
    <div data-include="header"></div>

    <main class="lab-page">

        <!-- Lab Intro -->
        <section class="lab-intro">
            <h1>Low-Entropy Lab</h1>
            <p>Artifact Storage // Experimental</p>
        </section>

        <!-- Monitor Wall: Compact Heap Pile (Restored) -->
        <section class="monitor-wall">

            <!-- ROW 1: BASE LAYER (Floor) - Anchors -->

            <!-- 1. Wide Idle (Left Base) -->
            <!-- Tucked closer to main -->
            <div class="monitor-casing size-wide state-idle style-beige" style="--x: 285px; --y: 0px; --z: 15;">
                <div class="screen">
                    <div class="screen-content"></div>
                </div>
                <div class="monitor-controls bottom">
                    <div class="power-led on"></div>
                    <div class="slider-group">
                        <div class="slider"></div>
                        <div class="slider"></div>
                    </div>
                </div>
            </div>

            <!-- 2. Main Active (Center Base - Dominant) -->
            <a href="/pages/fraud_detector.html" class="monitor-link" style="--x: 580px; --y: 0px; --z: 20;">
                <div class="monitor-casing size-lg state-active">
                    <div class="screen">
                        <div class="screen-content">
                            <div class="project-title">FRAUD<br>DETECTOR</div>
                            <div class="project-desc">AUTO-TRIAGE<br>SYSTEM</div>
                            <div class="status-indicator"><span class="blink-dot">●</span> LIVE</div>
                        </div>
                    </div>
                    <div class="monitor-chin">
                        <div class="brand-badge">SONY</div>
                        <div class="control-row">
                            <div class="power-led on"></div>
                            <div class="switch-toggle"></div>
                            <div class="button-rect"></div>
                            <div class="knob"></div>
                            <div class="knob small"></div>
                            <div class="knob small"></div>
                        </div>
                    </div>
                </div>
            </a>

            <!-- 3. Med Glitch (Right Base) -->
            <!-- Tucked closer to main -->
            <div class="monitor-casing size-md state-glitch style-rubbery" style="--x: 960px; --y: 0px; --z: 15;">
                <div class="screen">
                    <div class="screen-content">EXP_02</div>
                </div>
                <div class="monitor-controls right-side">
                    <div class="switch-toggle" style="transform:rotate(90deg);"></div> <!-- Converted to Switch -->
                </div>
            </div>


            <!-- ROW 2: BRIDGE LAYER (Sitting on Seams) -->

            <!-- 4. Med Idle (Far Left Leaning - UPDATED TO RETRO TV) -->
            <!-- Rotated to show depth -->
            <div class="monitor-casing size-md state-retro-noise style-retro-tv"
                style="--x: 30px; --y: 8px; --z: 10; --r: -4deg;">
                <div class="screen"></div>
                <div class="monitor-controls right-side">
                    <div class="knob"></div>
                    <div class="knob small"></div>
                    <div class="knob small"></div>
                    <div class="power-led"></div>
                </div>
            </div>

            <!-- 5. Rack Reserved (Bridging Wide/Main) -->
            <!-- Shifted LEFT to clear main screen -->
            <div class="monitor-casing size-rack state-reserved style-rack-silver"
                style="--x: 360px; --y: 200px; --z: 25;">
                <div class="screen">
                    <div class="screen-content">RES</div>
                </div>
                <div class="rack-ears"></div>
            </div>

            <!-- 6. Small Off (Bridging Main/Med) -->
            <!-- Shifted RIGHT to clear main screen -->
            <div class="monitor-casing size-sm-md state-off style-bakelite"
                style="--x: 951px; --y: 326px; --z: 22; --r: -14deg;">
                <div class="screen"></div>
                <div class="monitor-controls">
                    <div class="power-led off"></div>
                    <div class="knob"></div>
                    <div class="knob small"></div>
                    <div class="knob small"></div>
                    <div class="switch-toggle" style="transform: scale(0.8);"></div>
                </div>
            </div>


            <!-- ROW 3: PEAK LAYER -->

            <!-- 7. Small Idle (Peak Left - on Rack) -->
            <!-- Dropped down to sit on #5 -->
            <div class="monitor-casing size-sm state-idle style-military"
                style="--x: 385px; --y: 350px; --z: 30; --r: -4deg;">
                <div class="screen"></div>
                <div class="monitor-controls">
                    <div class="knob small"></div>
                    <div class="knob"></div>
                    <div class="power-led red-beam"></div>
                </div>
            </div>

            <!-- 8. Med Off (Peak Center - High) -->
            <!-- Dropped down significantly to sit on Main -->
            <div class="monitor-casing size-md-lg state-off style-titanium" style="--x: 605px; --y: 300px; --z: 35;">
                <div class="screen"></div>
                <div class="monitor-controls">
                    <div class="slider-group">
                        <div class="slider"></div>
                        <div class="slider"></div>
                        <div class="slider"></div>
                    </div>
                    <div class="switch-toggle" style="margin-left: 0.5rem; transform: rotate(90deg);"></div>
                    <div class="button-rect"></div>
                    <div class="knob small"></div>
                </div>
            </div>

            <!-- 9. Small Idle (Right Satellite - Tucked) -->
            <!-- Sitting on the Med Glitch -->
            <div class="monitor-casing size-sm-lg state-pink-noise style-glossy"
                style="--x: 1020px; --y: 187px; --z: 18; --r: -4deg;">
                <div class="screen"></div>
            </div>

            <!-- 10. Rack (Far Right - Leaning In) -->
            <!-- No longer vertical monolith, now leaning against pile -->
            <div class="monitor-casing size-rack state-off style-rusted"
                style="--x: 1210px; --y: 60px; --z: 5; --r: -85deg;">
                <div class="screen"></div>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <div data-include="footer"></div>

    <!-- Scripts -->
    <script src="../assets/js/loading.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/include-components.js"></script>

</body>

</html>
